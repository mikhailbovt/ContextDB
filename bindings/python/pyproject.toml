[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "contextdb-embedded"
version = "0.1.0a1"
description = "Embedded Python bindings for ContextDB"
requires-python = ">=3.9"
license = "Apache-2.0"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Typing :: Typed",
]

[tool.maturin]
module-name = "contextdb_embedded._contextdb"
python-source = "python"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "contextdb-sdk"
version = "0.2.0a2"
description = "Typed Python HTTP SDK for ContextDB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ContextDB contributors" }]
dependencies = ["blake3==1.0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/contextdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

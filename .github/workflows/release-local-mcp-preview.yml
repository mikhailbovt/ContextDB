name: Publish local MCP developer preview

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: "local-mcp-preview-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-platform:
    name: "Build and verify ${{ matrix.platform }} preview"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: windows-2025
            platform: windows-x86_64
    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      PLATFORM: "${{ matrix.platform }}"
      PYO3_PYTHON: python
      RELEASE_TAG: "${{ github.ref_name }}"
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Bind the release tag to the Cargo and version manifests
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Publishing requires an exact Git tag ref." >&2
            exit 1
          fi
          python tools/local-mcp-preview/release_assets.py validate-tag \
            --tag "${RELEASE_TAG}" --github-env "${GITHUB_ENV}"

      - name: Report the pinned native build toolchain
        shell: bash
        run: |
          python --version
          rustup show
          rustc -vV
          cargo --version

      - name: Verify both target contracts and the native listener-free profile
        shell: bash
        run: |
          python -m unittest discover -s tools/local-mcp-preview/tests -v
          python tools/local-mcp-preview/local_mcp_preview.py \
            --platform "${PLATFORM}" verify
          python tools/local-mcp-preview/generate_supply_chain.py verify \
            --platform "${PLATFORM}"

      - name: Build and package on the native target
        shell: bash
        run: |
          python tools/local-mcp-preview/local_mcp_preview.py \
            --platform "${PLATFORM}" package \
            --output-dir "dist/${PLATFORM}" \
            --target-dir "target/local-mcp-release/${PLATFORM}/cargo"

      - name: Verify package custody and materialize exact standalone assets
        shell: bash
        run: |
          python tools/local-mcp-preview/release_assets.py prepare \
            --platform "${PLATFORM}" \
            --dist "dist/${PLATFORM}" \
            --target-dir "target/local-mcp-release/${PLATFORM}/cargo"

      - name: Preserve the four independently verified target assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "contextdb-local-mcp-${{ github.ref_name }}-${{ matrix.platform }}"
          path: "dist/${{ matrix.platform }}/*"
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish verified Linux and Windows prerelease
    needs: build-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: "${{ github.token }}"
      RELEASE_TAG: "${{ github.ref_name }}"
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download both native target asset sets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "contextdb-local-mcp-${{ github.ref_name }}-*"
          merge-multiple: true
          path: dist

      - name: Bind the tag and verify all eight platform-specific assets
        shell: bash
        run: |
          python tools/local-mcp-preview/release_assets.py validate-tag \
            --tag "${RELEASE_TAG}" --github-env "${GITHUB_ENV}"
          python tools/local-mcp-preview/release_assets.py verify-release-set --dist dist
          python tools/local-mcp-preview/release_assets.py write-notes \
            --output "${RUNNER_TEMP}/contextdb-release-notes.md" \
            --source-commit "${GITHUB_SHA}"

      - name: Create or update the exact GitHub prerelease
        shell: bash
        run: |
          remote_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          if [[ "${remote_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Remote release tag no longer resolves to the verified source commit." >&2
            exit 1
          fi

          release_title="ContextDB ${VERSION} local MCP developer preview"
          release_notes="${RUNNER_TEMP}/contextdb-release-notes.md"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            prerelease="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --json isPrerelease --jq .isPrerelease)"
            if [[ "${prerelease}" != "true" ]]; then
              echo "Refusing to replace an existing non-prerelease." >&2
              exit 1
            fi
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --title "${release_title}" --notes-file "${release_notes}" --prerelease
          else
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --verify-tag --title "${release_title}" \
              --notes-file "${release_notes}" --prerelease
          fi

          gh release upload "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --clobber

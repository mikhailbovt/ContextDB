name: M0 continuous integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  governance:
    name: Governance and schema validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned governance validators
        run: >-
          python3 -m pip install
          --disable-pip-version-check
          --no-input
          jsonschema==4.26.0
          PyYAML==6.0.3
      - name: Test the local MCP preview package contract
        run: python3 -m unittest discover -s tools/local-mcp-preview/tests -v
      - name: Validate governance artifacts
        run: python3 .github/scripts/validate_governance.py .

  rust:
    name: "Rust ${{ matrix.target }} (${{ matrix.tier }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            tier: required
            experimental: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            tier: required
            experimental: false
          - os: macos-14
            target: aarch64-apple-darwin
            tier: required
            experimental: false
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            tier: best-effort
            experimental: true
    runs-on: "${{ matrix.os }}"
    continue-on-error: "${{ matrix.experimental }}"
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      PYO3_PYTHON: python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Python for PyO3 tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Report pinned toolchain and native target
        run: |
          python --version
          rustup show
          rustc -vV
          cargo --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify the native supported local MCP preview profile
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          python tools/local-mcp-preview/local_mcp_preview.py verify
          python tools/local-mcp-preview/generate_supply_chain.py verify
      - name: Verify the listener-free local MCP source boundary
        run: |
          cargo check --locked -p contextdb-cli --bin contextdb --no-default-features --features local-mcp
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run workspace tests
        env:
          CONTEXTDB_TEST_SEED: "6840227782638526189"
        run: cargo test --workspace --all-features --locked
      - name: Reclaim test build space
        run: cargo clean
      - name: Reject Rust documentation warnings
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Reclaim documentation build space
        run: cargo clean
      - name: Build and install the native Python wheel
        run: |
          python -m pip install --disable-pip-version-check --no-input maturin==1.10.2
          python -m maturin build --manifest-path bindings/python/Cargo.toml --locked --release --out target/python-wheels
          python -c "import glob, subprocess, sys; wheels = glob.glob('target/python-wheels/*.whl'); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[0]])"
          python -c "from contextdb_embedded import ContextDb; database = ContextDb('ci-wheel-smoke', bytes([7]) * 32); print(type(database).__name__)"
      - name: Require a manylinux-compatible Python extension link boundary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          module="$(python -c 'import contextdb_embedded._contextdb as native; print(native.__file__)')"
          if readelf -d "$module" | grep -q libpython; then
            echo "Python extension unexpectedly links libpython" >&2
            exit 1
          fi

  sdk:
    name: HTTP SDK parity and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23.x"
          cache-dependency-path: sdk/go/go.mod
      - name: Install pinned Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Test and type-check the Python SDK
        working-directory: sdk/python
        env:
          PYTHONPATH: src
        run: |
          python -m pip install --disable-pip-version-check --no-input --editable . build==1.5.0 ruff==0.16.2 mypy==2.3.0
          python -m unittest discover -s tests -v
          python -m compileall -q src examples
          python -m build
          ruff check src tests examples
          ruff format --check src tests examples
          mypy --strict src tests
      - name: Test and vet the Go SDK
        working-directory: sdk/go
        run: |
          go test -race ./...
          go vet ./...
      - name: Build and test the TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci
          npm test
          npm pack --dry-run

  supply-chain:
    name: Dependency audit and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned audit tools
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-deny --locked --version 0.20.2
      - name: Audit Rust advisories
        run: cargo audit --deny warnings
      - name: Check license, ban, and source policy
        run: cargo deny --all-features --locked check

  fuzz-smoke:
    name: Parser and format fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-08-01 --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2
      - name: Require and run every fuzz target briefly
        working-directory: fuzz
        shell: bash
        run: |
          mapfile -t targets < <(cargo +nightly-2026-08-01 fuzz list)
          if [[ ${#targets[@]} -eq 0 ]]; then
            echo "No fuzz targets are registered" >&2
            exit 1
          fi
          for target in "${targets[@]}"; do
            cargo +nightly-2026-08-01 fuzz run "$target" -- -max_total_time=15 -timeout=5
          done

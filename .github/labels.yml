schema_version: contextdb.issue-labels/v1
labels:
  - name: "type:bug"
    color: "d73a4a"
    description: "Confirmed defect or invariant violation"
  - name: "type:feature"
    color: "1d76db"
    description: "New user-visible or engine capability"
  - name: "type:research"
    color: "8b5cf6"
    description: "Hypothesis requiring baseline, metric, and ablation"
  - name: "type:governance"
    color: "5319e7"
    description: "RFC, ADR, roadmap, compatibility, or release governance"
  - name: "type:security"
    color: "b60205"
    description: "Security, privacy, consent, trust, or deletion work"
  - name: "priority:critical"
    color: "7a0000"
    description: "Blocks release or risks data loss or unauthorized disclosure"
  - name: "priority:high"
    color: "d93f0b"
    description: "Required soon; substantial correctness or product impact"
  - name: "priority:normal"
    color: "fbca04"
    description: "Normal planned work"
  - name: "status:blocked"
    color: "000000"
    description: "Cannot progress until a named dependency or decision changes"
  - name: "status:needs-evidence"
    color: "c5def5"
    description: "Claim lacks required test, benchmark, or trace evidence"
  - name: "subsystem:core"
    color: "0052cc"
    description: "Universal domain types, IDs, invariants, and errors"
  - name: "subsystem:reference"
    color: "0052cc"
    description: "In-memory deterministic correctness implementation"
  - name: "subsystem:format"
    color: "006b75"
    description: "Record, key, segment, manifest, checksum, and migration formats"
  - name: "subsystem:storage"
    color: "006b75"
    description: "Storage engine abstraction and physical substrate adapters"
  - name: "subsystem:journal"
    color: "006b75"
    description: "Semantic journal, commit coordination, outbox, and replay"
  - name: "subsystem:graph"
    color: "0e8a16"
    description: "Typed graph, adjacency, traversal, activation, and compaction"
  - name: "subsystem:temporal"
    color: "0e8a16"
    description: "Bitemporal intervals, revisions, supersession, and conflicts"
  - name: "subsystem:hierarchy"
    color: "0e8a16"
    description: "Versioned views, summaries, invalidation, and drill-down"
  - name: "subsystem:vector"
    color: "0e8a16"
    description: "Vector spaces, exact scan, HNSW, filters, and rebuild"
  - name: "subsystem:lexical"
    color: "0e8a16"
    description: "Lexical projection, exact delta, and Tantivy integration"
  - name: "subsystem:artifact"
    color: "0e8a16"
    description: "Artifact metadata, content locators, selectors, and lineage"
  - name: "subsystem:subject"
    color: "0e8a16"
    description: "MemorySubject, spaces, perspective, ownership, and consent"
  - name: "subsystem:recall"
    color: "1d76db"
    description: "Memory gate, planner, retrievers, fusion, and sufficiency"
  - name: "subsystem:context"
    color: "1d76db"
    description: "ContextPack selection, budgets, compression, and renderers"
  - name: "subsystem:models"
    color: "1d76db"
    description: "Capability gateway, provider policy, schema, audit, and mocks"
  - name: "subsystem:memory-write"
    color: "1d76db"
    description: "Extraction, adjudication, promotion, consolidation, and reflection"
  - name: "subsystem:conversation"
    color: "1d76db"
    description: "Sessions, turns, referents, shared history, and calibration"
  - name: "subsystem:lifecycle"
    color: "1d76db"
    description: "Preflight, postflight, checkpoint, resume, migration, and handoff"
  - name: "subsystem:interfaces"
    color: "0366d6"
    description: "Server, HTTP, CLI, MCP, bindings, SDKs, and middleware"
  - name: "subsystem:domain-pack"
    color: "0366d6"
    description: "Generic domain extension contracts and registries"
  - name: "subsystem:knowledge"
    color: "0366d6"

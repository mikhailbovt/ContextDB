[workspace]
resolver = "3"
members = [
    "bindings/python",
    "crates/contextdb-bench",
    "crates/contextdb-chat",
    "crates/contextdb-cli",
    "crates/contextdb-cognition",
    "crates/contextdb-context",
    "crates/contextdb-conformance",
    "crates/contextdb-continuity",
    "crates/contextdb-core",
    "crates/contextdb-domain-code",
    "crates/contextdb-format",
    "crates/contextdb-graph",
    "crates/contextdb-hierarchy",
    "crates/contextdb-journal",
    "crates/contextdb-knowledge",
    "crates/contextdb-index",
    "crates/contextdb-model",
    "crates/contextdb-mcp",
    "crates/contextdb-native-service",
    "crates/contextdb-proto",
    "crates/contextdb-recall",
    "crates/contextdb-reference",
    "crates/contextdb-runtime",
    "crates/contextdb-security",
    "crates/contextdb-secure-store",
    "crates/contextdb-service",
    "crates/contextdb-server",
    "crates/contextdb-storage",
    "crates/contextdb-storage-fjall",
    "crates/contextdb-storage-fault",
    "crates/contextdb-storage-memory",
    "crates/contextdb-storage-redb",
    "crates/contextdb-storage-bench",
    "examples/embedded-rust",
]
exclude = ["crates/contextdb-storage-rocksdb-bench"]

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.97"
authors = ["Mikhail Bovt and ContextDB contributors"]
license = "Apache-2.0"
repository = "https://github.com/mikhailbovt/ContextDB"
homepage = "https://github.com/mikhailbovt/ContextDB"
description = "AI-native persistent memory engine for language models and AI systems"

[workspace.dependencies]
axum = "0.8.9"
blake3 = "1.8.6"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4.6.6", features = ["derive"] }
contextdb-bench = { version = "0.2.0-alpha.1", path = "crates/contextdb-bench" }
contextdb-chat = { version = "0.2.0-alpha.1", path = "crates/contextdb-chat" }
contextdb-cognition = { version = "0.2.0-alpha.1", path = "crates/contextdb-cognition" }
contextdb-core = { version = "0.2.0-alpha.1", path = "crates/contextdb-core" }
contextdb-context = { version = "0.2.0-alpha.1", path = "crates/contextdb-context" }
contextdb-conformance = { version = "0.2.0-alpha.1", path = "crates/contextdb-conformance" }
contextdb-continuity = { version = "0.2.0-alpha.1", path = "crates/contextdb-continuity" }
contextdb-domain-code = { version = "0.2.0-alpha.1", path = "crates/contextdb-domain-code" }
contextdb-format = { version = "0.2.0-alpha.1", path = "crates/contextdb-format" }
contextdb-graph = { version = "0.2.0-alpha.1", path = "crates/contextdb-graph" }
contextdb-hierarchy = { version = "0.2.0-alpha.1", path = "crates/contextdb-hierarchy" }
contextdb-index = { version = "0.2.0-alpha.1", path = "crates/contextdb-index" }
contextdb-journal = { version = "0.2.0-alpha.1", path = "crates/contextdb-journal" }
contextdb-knowledge = { version = "0.2.0-alpha.1", path = "crates/contextdb-knowledge" }
contextdb-mcp = { version = "0.2.0-alpha.1", path = "crates/contextdb-mcp" }
contextdb-model = { version = "0.2.0-alpha.1", path = "crates/contextdb-model" }
contextdb-native-service = { version = "0.2.0-alpha.1", path = "crates/contextdb-native-service" }
contextdb-proto = { version = "0.2.0-alpha.1", path = "crates/contextdb-proto", default-features = false }
contextdb-recall = { version = "0.2.0-alpha.1", path = "crates/contextdb-recall" }
contextdb-reference = { version = "0.2.0-alpha.1", path = "crates/contextdb-reference" }
contextdb-runtime = { version = "0.2.0-alpha.1", path = "crates/contextdb-runtime" }
contextdb-security = { version = "0.2.0-alpha.1", path = "crates/contextdb-security" }
contextdb-secure-store = { version = "0.2.0-alpha.1", path = "crates/contextdb-secure-store" }
contextdb-server = { version = "0.2.0-alpha.1", path = "crates/contextdb-server", default-features = false }
contextdb-service = { version = "0.2.0-alpha.1", path = "crates/contextdb-service" }
contextdb-storage = { version = "0.2.0-alpha.1", path = "crates/contextdb-storage" }
contextdb-storage-fault = { version = "0.2.0-alpha.1", path = "crates/contextdb-storage-fault" }
contextdb-storage-fjall = { version = "0.2.0-alpha.1", path = "crates/contextdb-storage-fjall" }
contextdb-storage-memory = { version = "0.2.0-alpha.1", path = "crates/contextdb-storage-memory" }
contextdb-storage-redb = { version = "0.2.0-alpha.1", path = "crates/contextdb-storage-redb" }
fjall = "3.1.8"
getrandom = "0.4.3"
ed25519-dalek = "3.0.0"
prost = "0.14.4"
proptest = "1.11.0"
pyo3 = "0.29.2"
redb = "4.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.23.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.6"
tower = "0.5.3"
unicode-normalization = "0.1.25"
uuid = { version = "1.24.0", features = ["serde", "v7"] }
winreg = "0.56.0"
zeroize = "1.9.0"
zstd = "0.13.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.release-safe]
inherits = "release"
debug = "line-tables-only"
overflow-checks = true

[profile.bench]
debug = "line-tables-only"

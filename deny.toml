[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

skip = [
  { crate = "base64@0.22.1", reason = "tonic wire runtime" },
  { crate = "base64@0.23.1", reason = "pinned Tantivy security-fix revision" },
  { crate = "foldhash@0.1.5", reason = "prost-build toolchain graph" },
  { crate = "foldhash@0.2.0", reason = "runtime index and cache graph" },
  { crate = "hashbrown@0.14.5", reason = "Fjall backend" },
  { crate = "hashbrown@0.15.5", reason = "prost-build toolchain graph" },
  { crate = "hashbrown@0.16.1", reason = "Fjall quick-cache graph" },
  { crate = "hashbrown@0.17.1", reason = "current runtime graph" },
  { crate = "syn@2.0.119", reason = "stable proc-macro ecosystem" },
  { crate = "syn@3.0.3", reason = "Rust 2024 proc-macro ecosystem" },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[[bans.features]]
name = "tantivy"
allow = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = ["https://github.com/quickwit-oss/tantivy"]

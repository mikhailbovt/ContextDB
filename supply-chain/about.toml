# License policy for the shipped Windows x86_64 local-MCP dependency graph.
#
# `tools/local-mcp-preview/generate_supply_chain.py` invokes cargo-about with
# the exact contextdb-cli/local-mcp feature selection and fails when a crate
# cannot be resolved under this policy. Choice order matters for OR expressions.
accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
]

targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
ignore-transitive-dependencies = false

# ContextDB workspace crates are covered by the repository's Apache-2.0
# LICENSE. The generated notice is intentionally limited to third parties.
private = { ignore = true }
